name: roomci smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  roomci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: albert-einshutoin/roomci@v0.1.1
        with:
          scenarios: roomci/smoke.yaml
          report-dir: roomci-reports
