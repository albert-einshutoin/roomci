version: "0.1"
scenario:
  name: generic_mqtt_retained_state
  description: Verify a generic MQTT edge-device command updates retained state.
  tags: [mqtt, generic, retained-state, contract]

mqtt:
  local:
    retained: true
  contracts:
    - name: generic_device_retained_state
      adapter: mqtt_v3_qos0_subset
      command_topic: fleet/demo/site/lab/device/{device_id}/command
      state_topic: fleet/demo/site/lab/device/{device_id}/state
      device_id_from_topic: placeholder:{device_id}
      payload:
        required_fields: [online, sample_interval_seconds]
        optional_fields: [mode]
        fields:
          online:
            type: boolean
          sample_interval_seconds:
            type: integer
            minimum: 1
          mode:
            type: string
            enum: [normal, low_power]

devices:
  - id: env_sensor_01
    type: sensor
    protocol: mqtt
    state:
      online: false
      sample_interval_seconds: 60

steps:
  - at: T
    mqtt_publish:
      client: edge_contract_test
      topic: fleet/demo/site/lab/device/env_sensor_01/command
      payload:
        online: true
        sample_interval_seconds: 30

assertions:
  - at: T+1s
    name: retained_state_updated
    mqtt:
      topic: fleet/demo/site/lab/device/env_sensor_01/state
      retained:
        online: true
        sample_interval_seconds: 30
  - at: T+2s
    name: local_broker_available
    target: mqtt.local
    condition: available
