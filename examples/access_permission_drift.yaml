version: "0.1"
scenario:
  name: access_permission_drift
  description: Detect stale users that remain in access-control systems after identity offboarding.
  tags: [access-control, drift]

inputs:
  identity_group:
    - alice@example.com
    - bob@example.com
  access_system_group:
    - alice@example.com
    - bob@example.com
    - retired@example.com

assertions:
  - at: T
    assert:
      access_control_drift: detected
