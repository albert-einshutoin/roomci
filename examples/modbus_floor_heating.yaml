version: "0.1"
scenario:
  name: modbus_floor_heating_0_1_degree_control
  description: Validate Modbus floor heating register map and 0.1°C control.
  tags: [modbus, commissioning]

modbus:
  devices:
    - id: floor_heating_01
      unit_id: 1
      holding_registers:
        40001:
          name: target_temperature
          type: decimal_0_1
          value: 230
          unit: celsius
        40002:
          name: eco_temperature
          type: decimal_0_1
          value: 210
          unit: celsius
      input_registers:
        30001:
          name: current_temperature
          type: decimal_0_1
          value: 228
          unit: celsius
        30002:
          name: slab_temperature
          type: decimal_0_1
          value: 221
          unit: celsius
      discrete_inputs:
        10001:
          name: error
          value: false
      coils:
        1:
          name: power
          value: true

steps:
  - at: T
    modbus_write:
      device: floor_heating_01
      register: 40001
      value: 245

assertions:
  - at: T+1s
    modbus:
      device: floor_heating_01
      register: 40001
      readable_value: 24.5
  - at: T+1s
    modbus:
      device: floor_heating_01
      register: 10001
      value: false
