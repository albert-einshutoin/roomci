name: smart-home-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin --fail-under 80
        run: cargo tarpaulin --workspace --engine llvm --fail-under 80 --skip-clean

      - name: check README quality drift
        run: bash ./scripts/check-readme-quality.sh

  roomci:
    name: Docker scenario suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Build roomci image
        run: docker build -t roomci:ci .

      - name: Validate adapter contracts
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v $PWD/adapter-contracts:/adapter-contracts:ro \
            roomci:ci \
            -c "roomci adapter validate /adapter-contracts/templates/company_adapter_contract.yaml /adapter-contracts/examples/*.yaml"

      - name: Validate public scenarios
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            validate \
            /scenarios/local_first_cloud_outage.yaml \
            /scenarios/edge_server_failover.yaml \
            /scenarios/modbus_floor_heating.yaml \
            /scenarios/dali_scene_partial_failure.yaml \
            /scenarios/bms_sauna_emergency_alert.yaml \
            /scenarios/starlink_failover.yaml \
            /scenarios/comfort_auto_mode.yaml \
            /scenarios/comfort_timeseries_replay.yaml \
            /scenarios/access_permission_drift.yaml \
            /scenarios/commissioning_checklist.yaml \
            /scenarios/intercom_relay_safe_mock.yaml \
            /scenarios/network_control_panel_fault_profiles.yaml \
            /scenarios/generic_mqtt_retained_state.yaml \
            /scenarios/generic_mqtt_duplicate_delivery.yaml \
            /scenarios/matter_gateway_profile.yaml \
            /scenarios/bacnet_contract_profile.yaml \
            /scenarios/knx_group_address_profile.yaml \
            /scenarios/opcua_contract_profile.yaml \
            /scenarios/hardware_ci_mqtt_room_fleet.yaml \
            /scenarios/hardware_ci_modbus_bms_commissioning.yaml \
            /scenarios/hardware_ci_mixed_protocol_regression.yaml

      - name: Run passing demo scenarios
        run: |
          for scenario in \
            local_first_cloud_outage.yaml \
            edge_server_failover.yaml \
            modbus_floor_heating.yaml \
            bms_sauna_emergency_alert.yaml \
            starlink_failover.yaml \
            comfort_auto_mode.yaml \
            comfort_timeseries_replay.yaml \
            access_permission_drift.yaml \
            commissioning_checklist.yaml \
            intercom_relay_safe_mock.yaml \
            network_control_panel_fault_profiles.yaml \
            generic_mqtt_retained_state.yaml \
            generic_mqtt_duplicate_delivery.yaml
          do
            name="${scenario%.yaml}"
            docker run --rm \
              -v $PWD/examples:/scenarios:ro \
              -v $PWD/reports:/reports \
              roomci:ci \
              run "/scenarios/${scenario}" \
              --junit "/reports/${name}.xml" \
              --report-md "/reports/${name}.md" \
              --report-json "/reports/${name}.json" \
              --timeline-json "/reports/${name}.timeline.json" \
              --timeline-ndjson "/reports/${name}.timeline.ndjson" \
              --observability-json "/reports/${name}.observability.json"
          done

      - name: Check service-mode config
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            serve --config /scenarios/local_first_cloud_outage.yaml --check
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            serve --config /scenarios/protocol_conformance_smoke.yaml --check

      - name: Run intentional failure-report scenario
        run: |
          set +e
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/dali_scene_partial_failure.yaml \
            --junit /reports/dali_scene_partial_failure.xml \
            --report-md /reports/dali_scene_partial_failure.md \
            --report-json /reports/dali_scene_partial_failure.json \
            --timeline-json /reports/dali_scene_partial_failure.timeline.json \
            --timeline-ndjson /reports/dali_scene_partial_failure.timeline.ndjson \
            --observability-json /reports/dali_scene_partial_failure.observability.json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Docker Compose integration tests
        run: |
          docker compose -f compose/docker-compose.yml build scenario-smoke
          docker compose -f compose/docker-compose.yml run --rm scenario-smoke
          docker compose -f compose/docker-compose.yml build hardware-ci-usecases
          docker compose -f compose/docker-compose.yml run --rm hardware-ci-usecases
          docker compose -f compose/docker-compose.yml build roomci-serve external-controller protocol-smoke
          docker compose -f compose/docker-compose.yml run --rm external-controller
          docker compose -f compose/docker-compose.yml run --rm protocol-smoke
          docker compose -f compose/docker-compose.yml build adapter-samples
          docker compose -f compose/docker-compose.yml run --rm adapter-samples
          docker compose -f compose/docker-compose.yml down

      - name: Upload roomci reports
        uses: actions/upload-artifact@v6
        with:
          name: roomci-reports
          path: reports

  release-evidence:
    name: Release evidence gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Protocol evidence check script
        run: python3 scripts/protocol_evidence_check.py

      - name: Protocol and domain evidence registry
        run: make protocol-evidence

      - name: Adapter sample smoke
        run: make adapter-samples-smoke

      - name: S-Tier evidence smoke
        run: make s-tier-evidence-smoke

      - name: Developer experience smoke
        run: make developer-experience-smoke

      - name: Protocol profile smoke
        run: make protocol-profile-smoke

      - name: PoC report artifact contract
        run: make poc-report-artifact-check

      - name: VSCode authoring assets
        run: make vscode-assets-check
