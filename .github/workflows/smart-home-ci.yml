name: smart-home-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin --fail-under 80
        run: cargo tarpaulin --workspace --engine llvm --fail-under 80 --skip-clean

  roomci:
    name: Docker scenario suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Build roomci image
        run: docker build -t roomci:ci .

      - name: Validate public scenarios
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            validate \
            /scenarios/local_first_cloud_outage.yaml \
            /scenarios/edge_server_failover.yaml \
            /scenarios/modbus_floor_heating.yaml \
            /scenarios/dali_scene_partial_failure.yaml \
            /scenarios/bms_sauna_emergency_alert.yaml \
            /scenarios/starlink_failover.yaml \
            /scenarios/comfort_auto_mode.yaml \
            /scenarios/access_permission_drift.yaml \
            /scenarios/commissioning_checklist.yaml

      - name: Run local-first cloud outage scenario
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/local_first_cloud_outage.yaml \
            --junit /reports/local_first_cloud_outage.xml \
            --report-md /reports/local_first_cloud_outage.md \
            --report-json /reports/local_first_cloud_outage.json

      - name: Run BMS emergency alert scenario
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/bms_sauna_emergency_alert.yaml \
            --junit /reports/bms_sauna_emergency_alert.xml \
            --report-md /reports/bms_sauna_emergency_alert.md \
            --report-json /reports/bms_sauna_emergency_alert.json

      - name: Run reliability depth scenarios
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/starlink_failover.yaml \
            --junit /reports/starlink_failover.xml \
            --report-md /reports/starlink_failover.md \
            --report-json /reports/starlink_failover.json
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/comfort_auto_mode.yaml \
            --junit /reports/comfort_auto_mode.xml \
            --report-md /reports/comfort_auto_mode.md \
            --report-json /reports/comfort_auto_mode.json

      - name: Upload roomci reports
        uses: actions/upload-artifact@v4
        with:
          name: roomci-reports
          path: reports
