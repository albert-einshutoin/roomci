name: smart-home-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin --fail-under 80
        run: cargo tarpaulin --workspace --engine llvm --fail-under 80 --skip-clean

  roomci:
    name: Docker scenario suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Build roomci image
        run: docker build -t roomci:ci .

      - name: Validate public scenarios
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            validate \
            /scenarios/local_first_cloud_outage.yaml \
            /scenarios/edge_server_failover.yaml \
            /scenarios/modbus_floor_heating.yaml \
            /scenarios/dali_scene_partial_failure.yaml \
            /scenarios/bms_sauna_emergency_alert.yaml \
            /scenarios/starlink_failover.yaml \
            /scenarios/comfort_auto_mode.yaml \
            /scenarios/comfort_timeseries_replay.yaml \
            /scenarios/access_permission_drift.yaml \
            /scenarios/commissioning_checklist.yaml \
            /scenarios/intercom_relay_safe_mock.yaml \
            /scenarios/network_control_panel_fault_profiles.yaml \
            /scenarios/generic_mqtt_retained_state.yaml \
            /scenarios/generic_mqtt_duplicate_delivery.yaml

      - name: Run passing demo scenarios
        run: |
          for scenario in \
            local_first_cloud_outage.yaml \
            edge_server_failover.yaml \
            modbus_floor_heating.yaml \
            bms_sauna_emergency_alert.yaml \
            starlink_failover.yaml \
            comfort_auto_mode.yaml \
            comfort_timeseries_replay.yaml \
            access_permission_drift.yaml \
            commissioning_checklist.yaml \
            intercom_relay_safe_mock.yaml \
            network_control_panel_fault_profiles.yaml \
            generic_mqtt_retained_state.yaml \
            generic_mqtt_duplicate_delivery.yaml
          do
            name="${scenario%.yaml}"
            docker run --rm \
              -v $PWD/examples:/scenarios:ro \
              -v $PWD/reports:/reports \
              roomci:ci \
              run "/scenarios/${scenario}" \
              --junit "/reports/${name}.xml" \
              --report-md "/reports/${name}.md" \
              --report-json "/reports/${name}.json" \
              --timeline-json "/reports/${name}.timeline.json" \
              --timeline-ndjson "/reports/${name}.timeline.ndjson" \
              --observability-json "/reports/${name}.observability.json"
          done

      - name: Check service-mode config
        run: |
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            roomci:ci \
            serve --config /scenarios/local_first_cloud_outage.yaml --check

      - name: Run intentional failure-report scenario
        run: |
          set +e
          docker run --rm \
            -v $PWD/examples:/scenarios:ro \
            -v $PWD/reports:/reports \
            roomci:ci \
            run /scenarios/dali_scene_partial_failure.yaml \
            --junit /reports/dali_scene_partial_failure.xml \
            --report-md /reports/dali_scene_partial_failure.md \
            --report-json /reports/dali_scene_partial_failure.json \
            --timeline-json /reports/dali_scene_partial_failure.timeline.json \
            --timeline-ndjson /reports/dali_scene_partial_failure.timeline.ndjson \
            --observability-json /reports/dali_scene_partial_failure.observability.json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Upload roomci reports
        uses: actions/upload-artifact@v4
        with:
          name: roomci-reports
          path: reports

  release-evidence:
    name: Release evidence gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Protocol and domain evidence registry
        run: make protocol-evidence

      - name: Adapter sample smoke
        run: make adapter-samples-smoke

      - name: Developer experience smoke
        run: make developer-experience-smoke
