version: "0.1"
scenario:
  name: welcome_scene_partial_failure
  description: Detect DALI-like lighting scene partial failure.
  tags: [dali, lighting, scene, qa]

lighting:
  fixtures:
    - id: D411S10
      protocol: dali
      area: living
      type: line_light
      group: welcome_scene
      level: 0
    - id: D411S11
      protocol: dali
      area: living
      type: downlight
      group: welcome_scene
      level: 0

scenes:
  welcome:
    fixtures:
      D411S10: 60
      D411S11: 40

faults:
  - at: T
    target: dali.fixture.D411S10
    type: command_drop

steps:
  - at: T
    command:
      target: scene.welcome
      action: activate

assertions:
  - at: T+3s
    assert:
      scene: welcome
      consistency: complete
