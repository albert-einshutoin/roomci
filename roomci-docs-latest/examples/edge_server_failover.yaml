version: "0.1"
scenario:
  name: edge_server_failover
  description: Verify secondary edge server takes over after primary failure.
  tags: [edge, control-panel, failover]

edge:
  primary:
    id: edge_primary
    status: active
  secondary:
    id: edge_secondary
    status: standby
  failover:
    enabled: true
    expected_within: 2s

faults:
  - at: T+10s
    target: edge.primary
    type: power_lost

assertions:
  - at: T+12s
    target: edge.secondary
    condition: active
  - at: T+15s
    target: mqtt.local
    condition: available
  - at: T+20s
    target: guest_experience
    condition: unaffected
