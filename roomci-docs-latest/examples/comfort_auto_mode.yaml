version: "0.1"
scenario:
  name: comfort_auto_mode
  description: Verify HVAC auto mode reaches target discomfort index without user override.
  tags: [comfort, hvac, automation]

sensors:
  ceiling:
    temperature: 30.5
    humidity: 62.1
  living_area:
    temperature: 28.5
    humidity: 49.4

comfort:
  target_discomfort_index: 74
  acceptable_range:
    min: 72
    max: 76

steps:
  - at: T
    automation:
      type: hvac_auto_mode
      room: living

assertions:
  - at: T+30m
    target: living_area.discomfort_index
    condition: between 72 and 76
  - at: T+2h
    target: user_override
    condition: false
