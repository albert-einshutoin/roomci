[workspace]
members = [
  "crates/roomci-cli",
  "crates/roomci-core",
  "crates/roomci-device-model",
  "crates/roomci-edge",
  "crates/roomci-fault",
  "crates/roomci-mqtt",
  "crates/roomci-ops",
  "crates/roomci-report",
  "crates/roomci-scenario",
  "crates/roomci-serve",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "CI-first contract emulator for edge-device and building-automation QA"
license = "Apache-2.0"
repository = "https://github.com/albert-einshutoin/roomci"
readme = "README.md"
keywords = ["iot", "smart-home", "mqtt", "emulator", "ci"]
categories = ["simulation", "command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tempfile = "3.23.0"
