version: "0.1"
scenario:
  name: ac_preheat_failed
  description: AC preheat command is delayed and room is not comfortable by arrival.
  clock:
    start: "2026-08-10T14:00:00+09:00"
    guest_arrival: "2026-08-10T15:00:00+09:00"
    mode: simulated

room:
  id: room_nasu_001
  devices:
    - id: ac_living
      type: climate
      initial_state:
        mode: off
        setpoint_celsius: 28
        temperature_celsius: 28
    - id: temperature_living
      type: temperature_sensor
      initial_state:
        temperature_celsius: 28
    - id: gateway_main
      type: network_gateway
      initial_state:
        connectivity: online
        latency_ms: 20

steps:
  - at: "T-60m"
    command:
      target: ac_living
      action: set_temperature
      value: 24

  - at: "T-55m"
    fault:
      target: gateway_main
      type: latency
      latency_ms: 5000
      duration: "20m"

  - at: "T-5m"
    state:
      target: temperature_living
      patch:
        temperature_celsius: 27.8

assertions:
  - at: "T"
    type: sensor_threshold
    target: temperature_living
    condition: "<= 25.0"
    impact:
      level: medium
      message: Guest arrives before the room reaches target comfort temperature.
