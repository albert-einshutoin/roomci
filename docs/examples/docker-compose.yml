services:
  roomci:
    image: ghcr.io/albert-einshutoin/roomci:latest
    command: serve --config /roomci/room.yaml --http 0.0.0.0:8080 --mqtt 0.0.0.0:1883
    ports:
      - "8080:8080"
      - "1883:1883"
    volumes:
      - ./roomci:/roomci

  app-backend:
    build: ./backend
    environment:
      ROOMCI_HTTP_URL: http://roomci:8080
      ROOMCI_MQTT_URL: mqtt://roomci:1883
    depends_on:
      - roomci

  scenario-test:
    image: ghcr.io/albert-einshutoin/roomci:latest
    command: run /roomci/scenarios/checkin_lock_offline.yaml --junit /reports/roomci.xml --markdown /reports/roomci.md
    volumes:
      - ./roomci:/roomci
      - ./reports:/reports
    depends_on:
      - app-backend
      - roomci
