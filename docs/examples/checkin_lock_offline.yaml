version: "0.1"
scenario:
  name: checkin_lock_offline
  description: Smart lock goes offline before guest arrival and fallback access must be issued.
  clock:
    start: "2026-08-10T14:30:00+09:00"
    guest_arrival: "2026-08-10T15:00:00+09:00"
    mode: simulated

room:
  id: room_nasu_001
  devices:
    - id: lock_entrance
      type: smart_lock
      initial_state:
        lock_state: locked
        connectivity: online
    - id: gateway_main
      type: network_gateway
      initial_state:
        connectivity: online
        latency_ms: 20

steps:
  - at: "T-30m"
    event: pre_checkin_started

  - at: "T-5m"
    fault:
      target: lock_entrance
      type: offline
      duration: "8m"

  - at: "T"
    event: guest_arrived

  - at: "T+10s"
    command:
      target: lock_entrance
      action: unlock

assertions:
  - at: "T+60s"
    type: event_emitted
    event: fallback_access_issued
    within: "60s"
    impact:
      level: high
      message: Guest cannot enter room unless fallback access is issued.

  - at: "T+120s"
    type: event_emitted
    event: staff_notification_sent
    within: "120s"
    impact:
      level: medium
      message: Staff should be notified when fallback access is required.
