services:
  roomci-serve:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - serve
      - --config
      - /scenarios/generic_mqtt_retained_state.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --mqtt-port
      - "1883"
      - --allow-non-loopback
    volumes:
      - ../examples:/scenarios:ro

  external-controller:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh"]
    command:
      - /controllers/http_poc_controller.sh
    environment:
      ROOMCI_URL: http://roomci-serve:8080
      REPORT_DIR: /reports
    depends_on:
      - roomci-serve
    volumes:
      - ../examples/controllers:/controllers:ro
      - ../reports:/reports

  scenario-smoke:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        roomci run /scenarios/local_first_cloud_outage.yaml \
          --junit /reports/local_first_cloud_outage.xml \
          --report-md /reports/local_first_cloud_outage.md \
          --report-json /reports/local_first_cloud_outage.json &&
        roomci run /scenarios/edge_server_failover.yaml \
          --junit /reports/edge_server_failover.xml \
          --report-md /reports/edge_server_failover.md \
          --report-json /reports/edge_server_failover.json &&
        roomci run /scenarios/modbus_floor_heating.yaml \
          --junit /reports/modbus_floor_heating.xml \
          --report-md /reports/modbus_floor_heating.md \
          --report-json /reports/modbus_floor_heating.json &&
        roomci run /scenarios/bms_sauna_emergency_alert.yaml \
          --junit /reports/bms_sauna_emergency_alert.xml \
          --report-md /reports/bms_sauna_emergency_alert.md \
          --report-json /reports/bms_sauna_emergency_alert.json &&
        roomci run /scenarios/starlink_failover.yaml \
          --junit /reports/starlink_failover.xml \
          --report-md /reports/starlink_failover.md \
          --report-json /reports/starlink_failover.json &&
        roomci run /scenarios/comfort_auto_mode.yaml \
          --junit /reports/comfort_auto_mode.xml \
          --report-md /reports/comfort_auto_mode.md \
          --report-json /reports/comfort_auto_mode.json &&
        roomci run /scenarios/access_permission_drift.yaml \
          --junit /reports/access_permission_drift.xml \
          --report-md /reports/access_permission_drift.md \
          --report-json /reports/access_permission_drift.json &&
        roomci run /scenarios/commissioning_checklist.yaml \
          --junit /reports/commissioning_checklist.xml \
          --report-md /reports/commissioning_checklist.md \
          --report-json /reports/commissioning_checklist.json &&
        roomci run /scenarios/generic_mqtt_retained_state.yaml \
          --junit /reports/generic_mqtt_retained_state.xml \
          --report-md /reports/generic_mqtt_retained_state.md \
          --report-json /reports/generic_mqtt_retained_state.json &&
        roomci run /scenarios/generic_mqtt_duplicate_delivery.yaml \
          --junit /reports/generic_mqtt_duplicate_delivery.xml \
          --report-md /reports/generic_mqtt_duplicate_delivery.md \
          --report-json /reports/generic_mqtt_duplicate_delivery.json &&
        roomci serve --config /scenarios/local_first_cloud_outage.yaml --check &&
        set +e &&
        roomci run /scenarios/dali_scene_partial_failure.yaml \
          --junit /reports/dali_scene_partial_failure.xml \
          --report-md /reports/dali_scene_partial_failure.md \
          --report-json /reports/dali_scene_partial_failure.json
        status=$$?
        set -e
        test "$$status" -eq 1
    volumes:
      - ../examples:/scenarios:ro
      - ../reports:/reports
