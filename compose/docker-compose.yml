services:
  roomci-serve:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - serve
      - --config
      - /scenarios/protocol_conformance_smoke.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --mqtt-port
      - "1883"
      - --modbus-port
      - "5020"
      - --allow-non-loopback
    volumes:
      - ../examples:/scenarios:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  external-controller:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh"]
    command:
      - /controllers/http_poc_controller.sh
    environment:
      ROOMCI_URL: http://roomci-serve:8080
      REPORT_DIR: /reports
    depends_on:
      roomci-serve:
        condition: service_healthy
    volumes:
      - ../examples/controllers:/controllers:ro
      - ../reports:/reports

  protocol-smoke:
    build:
      context: ..
      dockerfile: compose/protocol-smoke.Dockerfile
    environment:
      ROOMCI_URL: http://roomci-serve:8080
      MQTT_HOST: roomci-serve
      MQTT_PORT: "1883"
      MODBUS_HOST: roomci-serve
      MODBUS_PORT: "5020"
    depends_on:
      roomci-serve:
        condition: service_healthy
    volumes:
      - ../examples/controllers:/controllers:ro

  adapter-samples:
    build:
      context: ..
      dockerfile: compose/adapter-samples.Dockerfile
    environment:
      ROOMCI_HTTP: http://roomci-serve:8080
      ROOMCI_MQTT: roomci-serve:1883
      ROOMCI_MODBUS: roomci-serve:5020
      GO111MODULE: "off"
    depends_on:
      roomci-serve:
        condition: service_healthy
    volumes:
      - ..:/work:ro
    command:
      - /bin/sh
      - -c
      - |
        go run ./examples/adapters/go-http-mqtt-modbus &&
        tsx ./examples/adapters/typescript-http-mqtt-modbus/index.ts

  python-sdk:
    build:
      context: ..
      dockerfile: compose/protocol-smoke.Dockerfile
    environment:
      ROOMCI_HTTP: http://roomci-serve:8080
      ROOMCI_MQTT: roomci-serve:1883
      ROOMCI_MODBUS: roomci-serve:5020
    depends_on:
      roomci-serve:
        condition: service_healthy
    volumes:
      - ..:/work:ro
    working_dir: /work
    command:
      - python
      - examples/adapters/python-http-mqtt-modbus/smoke.py

  scenario-smoke:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        roomci run /scenarios/local_first_cloud_outage.yaml \
          --junit /reports/local_first_cloud_outage.xml \
          --report-md /reports/local_first_cloud_outage.md \
          --report-json /reports/local_first_cloud_outage.json &&
        roomci run /scenarios/edge_server_failover.yaml \
          --junit /reports/edge_server_failover.xml \
          --report-md /reports/edge_server_failover.md \
          --report-json /reports/edge_server_failover.json &&
        roomci run /scenarios/modbus_floor_heating.yaml \
          --junit /reports/modbus_floor_heating.xml \
          --report-md /reports/modbus_floor_heating.md \
          --report-json /reports/modbus_floor_heating.json &&
        roomci run /scenarios/bms_sauna_emergency_alert.yaml \
          --junit /reports/bms_sauna_emergency_alert.xml \
          --report-md /reports/bms_sauna_emergency_alert.md \
          --report-json /reports/bms_sauna_emergency_alert.json &&
        roomci run /scenarios/starlink_failover.yaml \
          --junit /reports/starlink_failover.xml \
          --report-md /reports/starlink_failover.md \
          --report-json /reports/starlink_failover.json &&
        roomci run /scenarios/comfort_auto_mode.yaml \
          --junit /reports/comfort_auto_mode.xml \
          --report-md /reports/comfort_auto_mode.md \
          --report-json /reports/comfort_auto_mode.json &&
        roomci run /scenarios/access_permission_drift.yaml \
          --junit /reports/access_permission_drift.xml \
          --report-md /reports/access_permission_drift.md \
          --report-json /reports/access_permission_drift.json &&
        roomci run /scenarios/commissioning_checklist.yaml \
          --junit /reports/commissioning_checklist.xml \
          --report-md /reports/commissioning_checklist.md \
          --report-json /reports/commissioning_checklist.json &&
        roomci run /scenarios/generic_mqtt_retained_state.yaml \
          --junit /reports/generic_mqtt_retained_state.xml \
          --report-md /reports/generic_mqtt_retained_state.md \
          --report-json /reports/generic_mqtt_retained_state.json &&
        roomci run /scenarios/generic_mqtt_duplicate_delivery.yaml \
          --junit /reports/generic_mqtt_duplicate_delivery.xml \
          --report-md /reports/generic_mqtt_duplicate_delivery.md \
          --report-json /reports/generic_mqtt_duplicate_delivery.json &&
        roomci run /scenarios/intercom_relay_safe_mock.yaml \
          --junit /reports/intercom_relay_safe_mock.xml \
          --report-md /reports/intercom_relay_safe_mock.md \
          --report-json /reports/intercom_relay_safe_mock.json &&
        roomci run /scenarios/network_control_panel_fault_profiles.yaml \
          --junit /reports/network_control_panel_fault_profiles.xml \
          --report-md /reports/network_control_panel_fault_profiles.md \
          --report-json /reports/network_control_panel_fault_profiles.json &&
        roomci run /scenarios/comfort_timeseries_replay.yaml \
          --junit /reports/comfort_timeseries_replay.xml \
          --report-md /reports/comfort_timeseries_replay.md \
          --report-json /reports/comfort_timeseries_replay.json &&
        roomci serve --config /scenarios/local_first_cloud_outage.yaml --check &&
        set +e &&
        roomci run /scenarios/dali_scene_partial_failure.yaml \
          --junit /reports/dali_scene_partial_failure.xml \
          --report-md /reports/dali_scene_partial_failure.md \
          --report-json /reports/dali_scene_partial_failure.json
        status=$$?
        set -e
        test "$$status" -eq 1
    volumes:
      - ../examples:/scenarios:ro
      - ../reports:/reports

  hardware-ci-usecases:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        roomci adapter validate /adapter-contracts/examples/hardware_ci_multi_engineer_lab.yaml &&
        roomci validate \
          /scenarios/hardware_ci_mqtt_room_fleet.yaml \
          /scenarios/hardware_ci_modbus_bms_commissioning.yaml \
          /scenarios/hardware_ci_mixed_protocol_regression.yaml &&
        for scenario in \
          hardware_ci_mqtt_room_fleet.yaml \
          hardware_ci_modbus_bms_commissioning.yaml \
          hardware_ci_mixed_protocol_regression.yaml
        do
          name="$${scenario%.yaml}"
          roomci run "/scenarios/$${scenario}" \
            --junit "/reports/$${name}.xml" \
            --report-md "/reports/$${name}.md" \
            --report-json "/reports/$${name}.json" \
            --timeline-json "/reports/$${name}.timeline.json" \
            --timeline-ndjson "/reports/$${name}.timeline.ndjson" \
            --observability-json "/reports/$${name}.observability.json"
        done
    volumes:
      - ../adapter-contracts:/adapter-contracts:ro
      - ../examples:/scenarios:ro
      - ../reports:/reports
